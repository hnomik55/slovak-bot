name: deploy pages

# Постоянный адрес Mini App: https://hnomik55.github.io/slovak-bot/miniapp/
# Фронтенд лежит в папке miniapp/, адрес API берётся из miniapp/config.json
# (его обновляет tools/miniapp_tunnel.py при смене туннеля).

on:
  push:
    branches: [main]
    paths:
      - "miniapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages site exists (deploy from branch main, folder /miniapp)
        run: |
          echo "--- состояние сайта ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | tee pages-setup.txt
          echo ""
          if ! grep -q '"status": *"built"\|"build_type"\|"html_url"' pages-setup.txt; then
            echo "--- создаём сайт ---"
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"main","path":"/miniapp"}}' | tee -a pages-setup.txt
          fi

      - name: Publish diagnostics
        if: always()
        run: |
          git config user.name "ci" && git config user.email "ci@local"
          git checkout -B ci-pages
          git add -A pages-setup.txt || true
          git commit -m "ci: pages setup log" || true
          git push -f origin ci-pages || true
