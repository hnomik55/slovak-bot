name: deploy pages

# Постоянный адрес Mini App: https://hnomik55.github.io/slovak-bot/
# Фронтенд лежит в папке miniapp/, адрес API берётся из miniapp/config.json
# (его обновляет tools/miniapp_tunnel.py при смене туннеля).

on:
  push:
    branches: [main]
    paths:
      - "miniapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pages site
        run: |
          echo "--- создаём сайт Pages ---"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' | tee pages-setup.txt
          echo ""
          echo "--- состояние сайта ---"
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | tee -a pages-setup.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish diagnostics
        if: always()
        run: |
          git config user.name "ci" && git config user.email "ci@local"
          git add pages-setup.txt || true
          git commit -m "ci: pages setup log" || true
          git push || true
