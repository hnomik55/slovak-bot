name: deploy pages

# Постоянный адрес Mini App: https://hnomik55.github.io/slovak-bot/
# Фронтенд лежит в папке miniapp/, адрес API берётся из miniapp/config.json
# (его обновляет tools/miniapp_tunnel.py при смене туннеля).

on:
  push:
    branches: [main]
    paths:
      - "miniapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
