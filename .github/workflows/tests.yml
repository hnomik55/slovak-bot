name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Content stats
        run: python -c "import json;d=json.load(open('data/content.json'));m=d['meta'];print('уроков',m['lessons'],'заданий',m['tasks'],'слов',m['vocab'])"

      - name: Run tests
        run: |
          {
            echo "### Результаты тестов"
            echo ""
            for t in test_core test_flow test_webhook test_tts test_miniapp test_license; do
              echo "#### $t"
              python "tests/$t.py" 2>&1 | tail -40 || true
              echo ""
            done
          } | tee ci-output.txt

      - name: Compile check
        run: python -m compileall -q app bot.py tools

      - name: Publish test output
        if: always()
        run: |
          git config user.name "ci" && git config user.email "ci@local"
          git add ci-output.txt
          git commit -m "ci: output of tests" || true
          git push || true
