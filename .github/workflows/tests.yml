name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check content pipeline (парсит slovencina.html -> content.json)
        run: |
          sudo apt-get update && sudo apt-get install -y nodejs
          python tools/build_content.py --source "$GITHUB_WORKSPACE/fixtures/source" --out "$RUNNER_TEMP/out" || echo "фикстуры не приложены — пропускаем"

      - name: Core tests
        run: python tests/test_core.py

      - name: Flow tests (весь бот через aiogram, без сети)
        run: python tests/test_flow.py

      - name: Compile check
        run: python -m compileall -q app bot.py tools
